<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compliance Analyzer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root{
        --bg:            #faf9f7;
        --surface:       #ffffff;
        --border:        #ececea;
        --text:          #34363d;
        --text-muted:    #8b8f96;

        --blue:          #7c8bc4;
        --blue-hover:    #6b7ab3;
        --blue-light:    #eef0f8;
        --blue-light-hv: #e2e5f3;

        --teal:          #6d9a91;
        --teal-bg:       #eef5f3;
        --teal-border:   #dbe9e6;

        --green:         #7fa387;
        --green-bg:      #f0f6f1;
        --red:           #c08a7c;
        --red-bg:        #faf1ed;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 3rem 1.2rem 4rem;
        display:flex;
        justify-content:center;
        -webkit-font-smoothing: antialiased;
    }

    .sheet{
        max-width: 720px;
        width:100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.6rem 2.4rem 2.4rem;
        box-shadow: 0 1px 3px rgba(52,54,61,0.03), 0 16px 36px -24px rgba(52,54,61,0.14);
    }

    h1{
        font-size: 1.7rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text);
        margin-bottom: 0.4rem;
    }

    .subhead{
        font-size: 0.95rem;
        color: var(--text-muted);
        margin-bottom: 1.8rem;
        line-height:1.55;
    }

    /* ---------- drop zone ---------- */
    #dropZone{
        border: 1.5px dashed var(--border);
        border-radius: 14px;
        padding: 2.2rem 1rem;
        text-align:center;
        background: #fbfbfa;
        cursor:pointer;
        transition: border-color .18s ease, background-color .18s ease, transform .08s ease;
    }
    #dropZone:hover{
        border-color: var(--blue);
        background-color: var(--blue-light);
    }
    #dropZone.drag-over{
        border-color: var(--blue);
        background-color: var(--blue-light);
        transform: scale(0.995);
    }
    #dropZone .glyph{
        width:34px; height:34px;
        margin:0 auto 0.7rem;
        color: var(--blue);
    }
    #dropZone p{
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
    }
    #dropZone small{
        display:block;
        margin-top:6px;
        font-size: 0.82rem;
        color: var(--text-muted);
    }

    #fileInput{ display:none; }

    /* ---------- action bar ---------- */
    .action-bar{
        display:flex;
        flex-wrap:wrap;
        gap: 0.65rem;
        align-items:center;
        margin: 1rem 0 0.3rem;
    }

    .btn{
        font-family: inherit;
        border:none;
        border-radius: 999px;
        padding: 0.6rem 1.3rem;
        font-weight: 600;
        font-size: 0.87rem;
        cursor:pointer;
        display:inline-flex;
        align-items:center;
        gap:8px;
        white-space:nowrap;
        transition: background .15s ease, transform .08s ease, opacity .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .btn svg{ width:16px; height:16px; flex-shrink:0; }
    .btn:active:not(:disabled){ transform: scale(0.97); }
    .btn:focus-visible{ outline: 2px solid var(--blue); outline-offset: 2px; }
    .btn:disabled{ opacity:.42; cursor:not-allowed; transform:none; }

    /* Browse Files — white with border + folder icon */
    .btn-outline{
        background: #ffffff;
        border: 1.5px solid var(--border);
        color: var(--text);
    }
    .btn-outline:hover:not(:disabled){ border-color: #c7cdd6; background:#fafbfc; }

    /* Analyze Documents — light blue with magnifying glass */
    .btn-analyze{
        background: var(--blue-light);
        color: var(--blue);
    }
    .btn-analyze:hover:not(:disabled){ background: var(--blue-light-hv); }

    /* Clear All */
    .btn-danger{
        background: transparent;
        color: var(--red);
        border: 1.5px solid #f3d3d3;
    }
    .btn-danger:hover:not(:disabled){ background: var(--red-bg); }

    /* solid bright blue (Ask button) */
    .btn-primary{
        background: var(--blue);
        color: #ffffff;
    }
    .btn-primary:hover:not(:disabled){ background: var(--blue-hover); }

    /* ---------- file manifest ---------- */
    #fileList{ margin: 0.9rem 0 0.2rem; min-height: 30px; }
    #fileList ul{ list-style:none; }

    #fileList li{
        display:flex;
        align-items:center;
        gap:0.7rem;
        padding: 0.65rem 0.2rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
    }
    #fileList li:first-child{ border-top: 1px solid var(--border); }

    #fileList li .idx{
        font-size: 0.78rem;
        font-weight:600;
        color: var(--blue);
        width: 1.4em;
        flex-shrink:0;
    }
    #fileList li .meta{ flex:1; min-width:0; }
    #fileList li .fname{
        font-size: 0.88rem;
        color: var(--text);
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
        display:block;
    }
    #fileList li .fsize{
        font-size: 0.76rem;
        color: var(--text-muted);
    }
    #fileList li button{
        background:none;
        border:none;
        border-radius: 999px;
        padding: 0.28rem 0.7rem;
        font-size: 0.78rem;
        font-weight:600;
        color: var(--red);
        cursor:pointer;
        flex-shrink:0;
        transition: background .15s ease;
    }
    #fileList li button:hover{ background: var(--red-bg); }

    .file-placeholder{
        color: var(--text-muted);
        font-size: 0.88rem;
        padding: 0.5rem 0.2rem;
    }

    /* ---------- prompt row ---------- */
    .prompt-row{
        display:flex;
        align-items:center;
        gap:0.6rem;
        margin: 1.6rem 0 0.2rem;
    }
    .prompt-row input{
        flex:1;
        min-width:120px;
        padding: 0.72rem 1.1rem;
        border: 1.5px solid var(--border);
        border-radius: 999px;
        font-family: inherit;
        font-size: 0.92rem;
        color: var(--text);
        background: #ffffff;
        outline:none;
        transition: border-color .15s ease, box-shadow .15s ease;
    }
    .prompt-row input::placeholder{ color: #9aa3ad; }
    .prompt-row input:focus{
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(124,139,196,0.15);
    }
    .prompt-row .btn{ flex-shrink:0; }

    /* ---------- status bar ---------- */
    #status{
        display:flex;
        align-items:center;
        gap:0.6rem;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        margin: 1.4rem 0 0.2rem;
        font-size: 0.87rem;
        font-weight: 500;
        border: 1px solid transparent;
    }
    #status.info{ background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
    #status.info .spinner{
        width:12px; height:12px; border-radius:50%;
        border:2px solid rgba(109,154,145,0.22);
        border-top-color: var(--teal);
        animation: spin .7s linear infinite;
        flex-shrink:0;
    }
    #status.success{ background: var(--green-bg); border-color:#bfe8cd; color: var(--green); }
    #status.error{ background: var(--red-bg); border-color:#f3cccc; color: var(--red); }

    @keyframes spin{ to{ transform: rotate(360deg); } }

    /* ---------- results ---------- */
    #results{ margin-top: 0.8rem; }

    .doc-block{
        margin-bottom: 1.6rem;
        padding-bottom: 1.4rem;
        border-bottom: 1px solid var(--border);
    }
    .doc-block:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }

    .doc-block h3{
        font-size: 0.85rem;
        font-weight:700;
        color: var(--text);
        margin-bottom: 0.7rem;
        display:flex;
        align-items:center;
        gap:0.5em;
    }
    .doc-block h3 .file-icon{ color: var(--blue); }

    .finding{
        display:flex;
        gap: 0.85rem;
        padding: 0.75rem 0.9rem;
        border-left: 3px solid var(--border);
        margin-bottom: 0.55rem;
        background: #fbfbfa;
        border-radius: 0 10px 10px 0;
    }
    .finding.status-compliant{ border-left-color: var(--green); }
    .finding.status-flag{ border-left-color: var(--blue); }
    .finding.status-violation{ border-left-color: var(--red); }

    .finding .badge{
        font-size: 0.68rem;
        font-weight:700;
        letter-spacing:0.02em;
        text-transform:uppercase;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        height:fit-content;
        white-space:nowrap;
        flex-shrink:0;
    }
    .status-compliant .badge{ background: var(--green-bg); color: var(--green); }
    .status-flag .badge{ background: var(--blue-light); color: var(--blue); }
    .status-violation .badge{ background: var(--red-bg); color: var(--red); }

    .finding .body{ flex:1; }
    .finding .clause-title{
        font-weight:600;
        font-size: 0.94rem;
        color: var(--text);
        margin-bottom: 0.15rem;
    }
    .finding .clause-ref{
        font-size: 0.76rem;
        color: var(--text-muted);
        margin-left: 0.4em;
        font-weight:400;
    }
    .finding p{
        font-size: 0.87rem;
        color: var(--text-muted);
        line-height:1.5;
    }

    .qa-block{
        margin-top: 1.4rem;
        padding-top: 1.2rem;
        border-top: 1px dashed var(--border);
    }
    .qa-block .q{
        font-size: 0.85rem;
        font-weight:600;
        color: var(--blue);
        margin-bottom: 0.4rem;
    }
    .qa-block .a{
        font-size: 0.9rem;
        color: var(--text-muted);
        line-height:1.55;
        padding-left: 0.9rem;
        border-left: 2px solid var(--border);
    }

    /* ---------- responsive ---------- */
    @media (max-width: 560px){
        body{ padding: 1.6rem 0.7rem 3rem; }
        .sheet{ padding: 1.8rem 1.2rem 1.8rem; border-radius:14px; }
        h1{ font-size: 1.4rem; }
        .action-bar{ gap:0.45rem; }
        .btn{ padding: 0.55rem 1rem; font-size: 0.8rem; }
        .prompt-row input{ min-width: 140px; }
    }

    @media (prefers-reduced-motion: reduce){
        *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
</style>
</head>
<body>

    <div class="sheet">

        <h1>Compliance Analyzer</h1>
        <div class="subhead">Upload PDFs &amp; get instant compliance alerts.</div>

        <div id="dropZone">
            <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <path d="M14 2v6h6"/>
                <path d="M9.5 13.5h5M9.5 16.5h5"/>
            </svg>
            <p>Drag &amp; drop PDFs here</p>
            <small>or click to browse · up to 4 files · 10&nbsp;MB each</small>
        </div>

        <input type="file" id="fileInput" accept=".pdf,application/pdf" multiple />

        <div class="action-bar">
            <button class="btn btn-outline" id="uploadBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
                </svg>
                Browse Files
            </button>
            <button class="btn btn-analyze" id="analyzeBtn" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="m21 21-4.3-4.3"/>
                </svg>
                Analyze Documents
            </button>
            <button class="btn btn-danger" id="clearBtn" style="display:none;">Clear All</button>
        </div>

        <div id="fileList">
            <p class="file-placeholder">No files uploaded</p>
        </div>

        <div class="prompt-row">
            <input type="text" id="promptInput" placeholder="Ask a follow-up question…" />
            <button class="btn btn-primary" id="askBtn">Ask</button>
        </div>

        <div id="status"></div>

        <div id="results"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
