<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contract Compliance Analyzer</title>

    <!-- Minimal inline styles – clean & functional -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f6f8fa;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            color: #1e1e2a;
        }

        .app {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 2rem 1.8rem 2.2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.25rem;
        }

        .subhead {
            color: #5b6778;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            border-left: 3px solid #2b6cff;
            padding-left: 0.9rem;
        }

        /* drop zone */
        #dropZone {
            border: 2px dashed #cdd5e0;
            border-radius: 14px;
            padding: 1.8rem 1rem;
            text-align: center;
            background: #fafbfc;
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
            margin-bottom: 1.2rem;
        }

        #dropZone:hover {
            border-color: #8ba0c0;
            background: #f2f5f9;
        }

        #dropZone p {
            color: #4a5a72;
            font-weight: 450;
            margin: 0;
        }

        #dropZone small {
            display: block;
            margin-top: 6px;
            color: #7a8aa0;
            font-size: 0.85rem;
        }

        /* file input hidden */
        #fileInput {
            display: none;
        }

        /* action bar */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 0.7rem;
            align-items: center;
            margin: 0.6rem 0 1.2rem;
        }

        .btn {
            border: none;
            border-radius: 40px;
            padding: 0.55rem 1.3rem;
            font-weight: 500;
            font-size: 0.9rem;
            background: #eef1f5;
            color: #1e2a3a;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, opacity 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) {
            background: #e0e5ec;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-primary {
            background: #2b6cff;
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1a5be6;
        }

        .btn-danger {
            background: #e53e3e;
            color: #fff;
        }

        .btn-danger:hover:not(:disabled) {
            background: #cf2e2e;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #cdd5e0;
        }

        .btn-outline:hover:not(:disabled) {
            background: #f0f3f8;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* file list */
        #fileList {
            margin: 0.5rem 0 1rem;
            min-height: 38px;
        }

        #fileList ul {
            list-style: none;
            padding: 0;
        }

        #fileList li {
            background: #f2f5f9;
            border-radius: 10px;
            padding: 0.6rem 0.9rem;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        #fileList li button {
            background: #dce2ec;
            border: none;
            border-radius: 30px;
            padding: 0.2rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1f2a3c;
            cursor: pointer;
            transition: background 0.15s;
        }

        #fileList li button:hover {
            background: #c8d0de;
        }

        /* prompt row */
        .prompt-row {
            display: flex;
            gap: 0.6rem;
            margin: 1rem 0 1.2rem;
            flex-wrap: wrap;
        }

        .prompt-row input {
            flex: 1;
            min-width: 180px;
            padding: 0.55rem 1rem;
            border: 1.5px solid #d7dfe9;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #fafbfc;
            outline: none;
            transition: border-color 0.2s;
        }

        .prompt-row input:focus {
            border-color: #2b6cff;
            background: #ffffff;
        }

        .prompt-row .btn {
            flex-shrink: 0;
        }

        /* status */
        #status {
            display: none;
            padding: 0.65rem 1rem;
            border-radius: 12px;
            margin: 0.8rem 0 1.2rem;
            font-size: 0.92rem;
            font-weight: 450;
        }

        /* results */
        #results {
            margin-top: 1rem;
        }

        #results>div {
            border-radius: 14px;
            padding: 1rem 1.2rem;
        }

        hr {
            border: none;
            border-top: 1.5px solid #e4e9f0;
            margin: 0.8rem 0;
        }

        .file-placeholder {
            color: #7a8aa0;
            font-size: 0.9rem;
        }

        /* responsive */
        @media (max-width: 480px) {
            .app {
                padding: 1.2rem 1rem;
            }
            .action-bar {
                gap: 0.4rem;
            }
            .btn {
                padding: 0.45rem 1rem;
                font-size: 0.82rem;
            }
            .prompt-row input {
                min-width: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <h1>📄 Compliance Analyzer</h1>
        <div class="subhead">Upload PDFs &amp; get instant compliance alerts</div>

        <!-- DROP ZONE -->
        <div id="dropZone">
            <p>📁 Drag &amp; drop PDFs here</p>
            <small>or click to browse · up to 4 files · 10 MB each</small>
        </div>

        <!-- hidden file input -->
        <input type="file" id="fileInput" accept=".pdf,application/pdf" multiple />

        <!-- ACTION BUTTONS -->
        <div class="action-bar">
            <button class="btn btn-outline" id="uploadBtn">📁 Browse Files</button>
            <button class="btn btn-primary" id="analyzeBtn" disabled>🔍 Analyze Documents</button>
            <button class="btn btn-danger" id="clearBtn" style="display:none;">✕ Clear All</button>
        </div>

        <!-- FILE LIST -->
        <div id="fileList">
            <p class="file-placeholder">No files uploaded</p>
        </div>

        <!-- PROMPT / ASK ROW -->
        <div class="prompt-row">
            <input type="text" id="promptInput" placeholder="Ask a follow-up question…" />
            <button class="btn btn-primary" id="askBtn" disabled>Ask</button>
        </div>

        <!-- STATUS -->
        <div id="status"></div>

        <!-- RESULTS -->
        <div id="results"></div>

    </div>

    <!-- ====== SCRIPT ====== -->
    <script src="SCRIPT.js"></script>

</body>
</html>
